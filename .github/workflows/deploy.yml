name: FarmKonnect CI/CD Deployment

on:
  push:
    branches: ["dev"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 🔥 Build Docker images
      - name: Build Docker images for all services
        run: |
          docker build -t romybijoy/api-gateway:latest ./api-gateway
          docker build -t romybijoy/auth-service:latest ./auth-service
          docker build -t romybijoy/post-service:latest ./post-service
          docker build -t romybijoy/feed-service:latest ./feed-service
          docker build -t romybijoy/chat-service:latest ./chat-service
          docker build -t romybijoy/eureka-server:latest ./eureka-server
          docker build -t romybijoy/notification-service:latest ./notification-service
          docker build -t romybijoy/stories_service:latest ./stories_service

      # 🔐 Login to Docker Hub
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ⬆ Push images
      - name: Push Docker images
        run: |
          docker push romybijoy/api-gateway:latest
          docker push romybijoy/auth-service:latest
          docker push romybijoy/post-service:latest
          docker push romybijoy/feed-service:latest
          docker push romybijoy/chat-service:latest
          docker push romybijoy/eureka-server:latest
          docker push romybijoy/notification-service:latest
          docker push romybijoy/stories_service:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS Lightsail
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd ~/apps/backend
            docker compose pull
            docker compose up -d
            docker image prune -f
