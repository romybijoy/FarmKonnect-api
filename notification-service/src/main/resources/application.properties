spring.application.name=notification-service

server.port=4054
  # ========== KAFKA ========== #

#spring.kafka.bootstrap-servers=localhost:9095
#spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Optional: concurrency for higher throughput
spring.kafka.listener.concurrency=1

# ========== MONGODB ==========

#spring.data.mongodb.uri=mongodb://root:password@localhost:27017/notifications-db?authSource=admin
#spring.data.mongodb.uri=mongodb://root:password@notification-service-db:27017/notifications-db?authSource=admin
# Use container DNS name
spring.data.mongodb.uri=mongodb://root:password@notification-mongo:27017/notifications-db?authSource=admin

# ========== LOGGING (optional debug info) ==========
# logging.level.org.apache.kafka=INFO0
logging.level.com.fc.notificationservice=DEBUG

# ========== WEBSOCKET (SockJS endpoint already defined in config class) ==========

# WebSocket runs on same port with endpoint: /ws-notifications

grpc.server.port=6562

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost