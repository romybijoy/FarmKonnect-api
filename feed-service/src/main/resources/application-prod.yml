spring:
  datasource:
    url: jdbc:mysql://feed-service-db:3306/feed_srvc_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: good
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

follow:
  grpc:
    host: auth-service
    port: 6565

