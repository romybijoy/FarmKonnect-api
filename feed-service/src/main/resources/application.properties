spring.application.name=feed-service

#spring.datasource.url=jdbc:mysql://feed-service-db:3306/feed_srvc_db
#spring.datasource.username=user
#spring.datasource.password=password
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/feed_srvc_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=good
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

server.port=4055

# Logging
logging.level.root= info

grpc.server.port=9096

grpc.client.post-service.address=discovery:///post-service
grpc.client.post-service.negotiation-type=plaintext
grpc.client.post-service.enable-keep-alive=true
grpc.client.post-service.default-load-balancing-policy=round_robin


grpc.client.auth-service.address=discovery:///auth-service
#grpc.client.auth-service.address=static://auth-service:9090
#grpc.client.auth-service.address=static://localhost:6565
grpc.client.auth-service.negotiation-type=plaintext
grpc.client.auth-service.enable-keep-alive=true
grpc.client.auth-service.default-load-balancing-policy=round_robin

debug=true

spring.devtools.livereload.enabled=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true