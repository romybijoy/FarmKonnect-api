spring:
  datasource:
    url: jdbc:mysql://chat-service-db:3306/chat_srvc_db?useSSL=false&allowPublicKeyRetrieval=true
    username: user
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: redis
      port: 6379

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    prefer-ip-address: true

auth-service:
  url: http://auth-service:4051

chat:
  allowed-origins:
    - http://localhost:5173
    - https://farmkonnect.online
    - https://www.farmkonnect.online