spring.application.name=chat-service

spring.datasource.url=jdbc:mysql://chat-service-db:3306/chat_srvc_db
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

server.port=4052

# Logging
logging.level.root= info

#grpc.server.port=9091

#gRPC client to auth-service
#grpc.client.auth-service.address=discovery:///auth-service
grpc.client.auth-service.address=static://auth-service:9090
grpc.client.auth-service.negotiation-type=plaintext


auth-service.url=http://auth-service:4051
