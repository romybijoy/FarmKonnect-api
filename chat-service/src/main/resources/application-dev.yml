spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/chat_srvc_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: good
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      url: redis://localhost:6379

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: false
    hostname: localhost

auth-service:
  url: http://auth-service

chat:
  allowed-origins:
    - http://localhost:5173
