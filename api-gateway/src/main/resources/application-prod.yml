spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/user/**]':
            allowedOrigins:
              - https://farmkonnect.online
              - https://www.farmkonnect.online
              - http://localhost:5173
              - https://admin.farmkonnect.online
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

          '[/api/**]':
            allowedOrigins:
              - https://farmkonnect.online
              - https://www.farmkonnect.online
              - http://localhost:5173
              - https://admin.farmkonnect.online
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1

        - id: post-service-route
          uri: lb://post-service
          predicates:
            - Path=/api/post/**
          filters:
            - StripPrefix=2
            - JwtValidation

        - id: story-service-route
          uri: lb://stories-service
          predicates:
            - Path=/api/stories/**
          filters:
            - StripPrefix=2
            - JwtValidation

        - id: chat-service-route
          uri: lb://chat-service
          predicates:
            - Path=/api/chat/**, /api/presence/**, /api/reactions/**
          filters:
            - JwtValidation
            - RewritePath=/api/chat/(?<segment>.*), /$\{segment}

        - id: chat-ws-route
          uri: lb://chat-service
          predicates:
            - Path=/chat-ws/**
          filters: [ ]

        - id: notification-service-route
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=2
            - JwtValidation

        - id: feed-service-route
          uri: lb://feed-service
          predicates:
            - Path=/api/feed/**
          filters:
            - StripPrefix=2
            - JwtValidation

        - id: api-docs-users-route
          uri: lb://auth-service
          predicates:
            - Path=/api-docs/users
          filters:
            - RewritePath=/api-docs/users,/v3/api-docs

        - id: api-docs-post-route
          uri: lb://post-service
          predicates:
            - Path=/api-docs/post
          filters:
            - RewritePath=/api-docs/post,/v3/api-docs

        - id: api-docs-stories-route
          uri: lb://stories-service
          predicates:
            - Path=/api-docs/stories
          filters:
            - RewritePath=/api-docs/stories,/v3/api-docs

        - id: api-docs-chat-route
          uri: lb://chat-service
          predicates:
            - Path=/api-docs/chat
          filters:
            - RewritePath=/api-docs/chat,/v3/api-docs

        - id: api-docs-notification-route
          uri: lb://notification-service
          predicates:
            - Path=/api-docs/notification
          filters:
            - RewritePath=/api-docs/notification,/v3/api-docs

        - id: api-docs-feed-route
          uri: lb://feed-service
          predicates:
            - Path=/api-docs/feed
          filters:
            - RewritePath=/api-docs/feed,/v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: Auth Service
        url: /api-docs/users
      - name: Post Service
        url: /api-docs/post
      - name: Stories Service
        url: /api-docs/stories
      - name: Chat Service
        url: /api-docs/chat
      - name: Notification Service
        url: /api-docs/notification
      - name: Feed Service
        url: /api-docs/feed

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    prefer-ip-address: true

server:
  port: 4004
  address: 0.0.0.0
  ssl:
    enabled: false

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
