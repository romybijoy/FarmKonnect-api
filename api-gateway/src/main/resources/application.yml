#// spring.application.name=api-gateway

server:
  port: 4004 # Gateway listens on port 4004
auth:
  service:
    url: http://auth-service:4051
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:4000
              - http://localhost:5173
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: auth-service-route
          uri: http://auth-service:4051
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1

        # Route for /api/post/** to post-service
        - id: post-service-route
          uri: http://post-service:4050
          predicates:
            - Path=/api/post/**
          filters:
            - StripPrefix=2
            - JwtValidation


        # Route for /api/docs/users to auth-service /v3/api-docs
        - id: api-docs-users-route
          uri: http://auth-service:4051
          predicates:
            - Path=/api-docs/users
          filters:
            - RewritePath=/api-docs/users,/v3/api-docs

        - id: api-docs-post-route
          uri: http://post-service:4050
          predicates:
            - Path=/api-docs/post
          filters:
            - RewritePath=/api-docs/post,/v3/api-docs