services:
  api-gateway:
    image: romybijoy/api-gateway:latest
    container_name: api-gateway
    ports:
      - "4004:4004"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - auth-service
      - post-service
      - chat-service
      - stories-service
      - notification-service
      - feed-service
      - eureka-server
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal

  # ---------- AUTH SERVICE ----------
  auth-service-db:
    image: mysql:8
    container_name: auth-service-db
    restart: always
    environment:
      MYSQL_DATABASE: auth_srvc_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    volumes:
      - ./auth-mysql:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-ppassword" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  auth-service:
    image: romybijoy/auth-service:latest
    container_name: auth-service
    ports:
      - "4051:4051"
    environment:
      # Eureka client: point to the eureka-server container
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_PROFILES_ACTIVE=prod
      - MAIL_USER=romybijoy@gmail.com
      - MAIL_PASS=awjhmqsrqpprfpih
    depends_on:
      auth-service-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal

  # ---------- POST SERVICE ----------
  post-service-db:
    image: mysql:8
    container_name: post-service-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: post_srvc_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3308:3306"
    volumes:
      - ./post-mysql:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-ppassword" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  post-service:
    image: romybijoy/post-service:latest
    container_name: post-service
    ports:
      - "4050:4050"
    environment:
      # Eureka client: point to the eureka-server container
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      post-service-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal

  # ---------- STORIES SERVICE ----------

  stories-service-db:
    image: mysql:8
    container_name: stories-service-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stories_srvc_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "5003:3306"
    volumes:
      - ./stories-mysql:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-ppassword" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  stories-service:
    image: romybijoy/stories-service:latest
    container_name: stories-service
    ports:
      - "4053:4053"
    environment:
      # Eureka client: point to the eureka-server container
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      stories-service-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal

  # ---------- CHAT SERVICE ----------
  chat-service-db:
    image: mysql:8
    container_name: chat-service-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chat_srvc_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "5002:3306"
    volumes:
      - ./chat-mysql:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-ppassword" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  chat-service:
    image: romybijoy/chat-service:latest
    container_name: chat-service
    ports:
      - "4052:4052"
    environment:
      # Eureka client: point to the eureka-server container
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      chat-service-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal
  # ---------- NOTIFICATION SERVICE ----------
  notification-service:
    image: romybijoy/notification-service:latest
    container_name: notification-service
    ports:
      - "4054:4054"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Prefer injecting the full URI via env so Spring picks it up:
      - SPRING_DATA_MONGODB_URI=mongodb://root:password@notification-mongo:27017/notifications-db?authSource=admin
      - SPRING_REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
    depends_on:
          auth-service:
            condition: service_started
          post-service:
            condition: service_started
          chat-service:
            condition: service_started
          redis:
            condition: service_started
          kafka:
            condition: service_started
          notification-mongo:
            condition: service_started
    restart: on-failure
    healthcheck:
          # check Spring Actuator health if available; fallback to TCP check
        test: [ "CMD-SHELL", "curl -f http://localhost:4054/actuator/health || exit 1" ]
        interval: 20s
        timeout: 5s
        retries: 5
    deploy:
          resources:
            limits:
              cpus: '0.25'
              memory: 256M
    networks:
      - internal

        # ---------- MONGODB FOR NOTIFICATIONS ----------
  notification-mongo:
    image: mongo:6.0
    container_name: notification-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: notifications-db
    volumes:
      - mongo-notif-data:/data/db    # or your host path:/data/db
    ports:
      - "27017:27017"   # optional mapping
    networks:
      - internal

    #  --------- feed-service ------------------
  feed-service:
    image: romybijoy/feed-service:latest
    container_name: feed-service
    ports:
      - "4055:4055"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - feed-service-db
      - eureka-server
    networks:
      - internal

  feed-service-db:
    image: mysql:8.0
    container_name: feed-service-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: good
      MYSQL_DATABASE: feed_srvc_db
    ports:
      - "3307:3306"
    networks:
      - internal

  eureka-server:
    container_name: eureka-server
    image: romybijoy/eureka-server:latest
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - internal

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - internal

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    networks:
      - internal

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - internal

networks:
  internal:
    driver: bridge
volumes:
    mongo-notif-data:
      driver: local
