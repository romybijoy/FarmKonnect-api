spring:
  datasource:
    url: jdbc:mysql://post-service-db:3306/post_srvc_db?useSSL=false&allowPublicKeyRetrieval=true
    username: user
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: kafka:9092

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

grpc:
  client:
    ai-service:
      address: static://ai-service:50051
      negotiation-type: plaintext
      enable-keep-alive: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: ERROR