spring:
  application:
    name: stories-service

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

server:
  port: 4053

logging:
  level:
    root: INFO
    org:
      hibernate:
        SQL: ERROR
        type:
          descriptor:
            sql:
              BasicBinder: ERROR

grpc:
  server:
    port: 0      # random free port

  client:
    auth-service:
      address: discovery:///auth-service
      negotiation-type: plaintext
      enable-keep-alive: true
      default-load-balancing-policy: round_robin
