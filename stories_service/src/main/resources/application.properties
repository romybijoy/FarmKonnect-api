spring.application.name=stories_service

spring.datasource.url=jdbc:mysql://stories-service-db:3306/stories_srvc_db
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

server.port = 4053

logging.level.root= info

grpc.client.auth-service.address=static://auth-service:9090
grpc.client.auth-service.negotiation-type=plaintext
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

