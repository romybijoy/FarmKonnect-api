spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/stories_srvc_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: good
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: localhost
