syntax = "proto3";

option java_package = "com.userproto";
option java_multiple_files = true;
option java_outer_classname = "UserProto";

service UserService {
  rpc GetUserById (UserRequest) returns (UserResponse);
}

message UserRequest {
  string email = 1;
}

message UserResponse {
  string email = 1;
  string userName = 2;
  string image = 3;
  string district = 4;
  string description = 5;
}
